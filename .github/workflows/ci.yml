name: ENCAP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, dom, fileinfo, intl, mbstring, pdo_sqlite, sqlite3, tokenizer, xml, zip
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Laravel testing environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run Laravel feature tests
        run: php artisan test --compact

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check standalone browser scripts
        run: node --check public/js/encap-interactions.js && node --check public/js/language-switcher.js && node --check public/js/admin-gallery-manager.js && node --check public/js/site-motion.js && node --check public/js/hero-experience.js

      - name: Build production assets
        run: npm run build
